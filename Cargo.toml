[package]
name = "dossy"
version = "0.0.1"
edition = "2024"

[dependencies]
reqwest    = { version = "0.13", features = ["json"] }
tokio      = { version = "1",    features = ["full"] }
tokio-util = { version = "0.7",  features = ["rt"] }
clap       = { version = "4",    features = ["derive"] }
rand       = "0.9"
futures    = "0.3"
indicatif  = "0.17"
colored    = "2"
anyhow     = "1"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
